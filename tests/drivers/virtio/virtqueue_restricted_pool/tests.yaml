# Each board overlay carves a 64 KiB restricted-dma-pool out of the board's RAM,
# so the test only runs on boards with such an overlay.
tests:
  drivers.virtio.virtqueue_restricted_pool:
    platform_allow:
      - qemu_riscv64
      - qemu_cortex_a53
    integration_platforms:
      - qemu_riscv64
      - qemu_cortex_a53
    tags:
      - drivers
      - virtio
